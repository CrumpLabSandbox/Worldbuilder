<!doctype html>
<html lang="en">
<head>

  <title>thingsynth</title>
  <meta name="description" content="A painting by Matt Crump that plays Tonewheel, a tonewheel organ synth, in the browser." />
  <script type="module" crossorigin src="./assets/main-Bsi7c3DR.js"></script>

  </div>
  <footer id="bar">
    <label>Change how the organ sounds <select id="preset"></select></label>
    <button id="wander" type="button" aria-pressed="false" title="Let every parameter of the preset wander around it">Wander through the organ sound settings</button>
    <span id="shuffle-box"><button id="shuffle" type="button" title="Deal every parameter and note onto other animations of the painting">Remap the animations to the organ drawbars and keys</button><button id="unshuffle" type="button" title="Back to the curated mapping" hidden>&times;</button></span>
    <span id="status">off</span>
    <button id="keys-toggle" type="button" aria-pressed="false" title="Show or hide the on-screen piano">Piano keys</button>
    <a id="about-link" href="about.html">What is this?</a>
    <a id="debug-link" href="?debug">debug</a>
  </footer>
