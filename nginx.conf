server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build assets never change; world JSON should always be fresh.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location /worlds/ {
    add_header Cache-Control "no-cache";
  }
}
